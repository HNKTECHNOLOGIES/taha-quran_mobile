name: quran_mobile
description: "TAHA — طه : application mobile pour lire le Saint Coran hors connexion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  intl: ^0.20.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/branding/taha_logo.png
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: assets/branding/taha_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/quran/tafsir/ibn_kathir_ar/
    - assets/branding/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.otf
